<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,viewport-fit=cover">
<meta name="theme-color" content="#0b1020">
<title>AUNG AI STORY VIDEO PRO</title>

<style>
:root{
  --bg:#070b16;
  --panel:#0f172a;
  --panel2:#111c32;
  --line:#22304a;
  --text:#f5f7fb;
  --muted:#94a3b8;
  --accent:#7c5cff;
  --accent2:#00d4ff;
  --green:#22c55e;
  --yellow:#f59e0b;
  --red:#ef4444;
  --shadow:0 18px 50px rgba(0,0,0,.35);
}

*{
  box-sizing:border-box;
}

html,body{
  margin:0;
  padding:0;
  background:var(--bg);
  color:var(--text);
  font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
}

body{
  min-height:100vh;
}

button,
select,
input,
textarea{
  font:inherit;
}

button{
  cursor:pointer;
}

.app{
  min-height:100vh;
  display:flex;
}

/* SIDEBAR */

.sidebar{
  width:250px;
  position:fixed;
  inset:0 auto 0 0;
  background:#090e1c;
  border-right:1px solid var(--line);
  padding:20px 14px;
  z-index:50;
  overflow-y:auto;
}

.brand{
  padding:10px 12px 22px;
}

.brand-title{
  font-size:20px;
  font-weight:900;
  letter-spacing:.5px;
}

.brand-title span{
  color:var(--accent2);
}

.brand-sub{
  color:var(--muted);
  font-size:11px;
  margin-top:4px;
}

.nav{
  display:grid;
  gap:7px;
}

.nav button{
  width:100%;
  border:1px solid transparent;
  background:transparent;
  color:#b8c3d6;
  text-align:left;
  padding:12px 13px;
  border-radius:12px;
  font-weight:700;
  transition:.2s;
}

.nav button:hover{
  background:#111a2d;
  color:#fff;
}

.nav button.active{
  background:linear-gradient(135deg,#1a1740,#12263b);
  color:#fff;
  border-color:#33436a;
}

.side-status{
  margin-top:20px;
  padding:14px;
  background:#0e1729;
  border:1px solid var(--line);
  border-radius:14px;
}

.status-title{
  font-size:11px;
  color:var(--muted);
  text-transform:uppercase;
  letter-spacing:1px;
}

.status-value{
  font-size:18px;
  font-weight:900;
  margin-top:4px;
}

.status-small{
  font-size:11px;
  color:var(--muted);
  margin-top:3px;
}

/* MAIN */

.main{
  width:calc(100% - 250px);
  margin-left:250px;
  min-height:100vh;
}

.topbar{
  position:sticky;
  top:0;
  z-index:30;
  height:68px;
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:12px;
  padding:0 24px;
  background:rgba(7,11,22,.9);
  backdrop-filter:blur(18px);
  border-bottom:1px solid var(--line);
}

.top-title{
  font-size:18px;
  font-weight:900;
}

.top-actions{
  display:flex;
  gap:8px;
  flex-wrap:wrap;
}

.content{
  padding:24px;
  max-width:1500px;
  margin:auto;
}

/* BUTTONS */

.btn{
  border:1px solid var(--line);
  background:#111a2c;
  color:#fff;
  border-radius:10px;
  padding:10px 14px;
  font-weight:800;
  transition:.2s;
}

.btn:hover{
  transform:translateY(-1px);
  border-color:#405273;
}

.btn.primary{
  border-color:#6d58ed;
  background:linear-gradient(135deg,#7657ff,#4d39c9);
}

.btn.cyan{
  border-color:#0ca9c7;
  background:linear-gradient(135deg,#00a8ca,#1263d8);
}

.btn.green{
  border-color:#178b4a;
  background:#123c29;
}

.btn.danger{
  border-color:#7f2930;
  background:#35151a;
}

.btn.small{
  padding:7px 10px;
  font-size:12px;
}

/* CARDS */

.grid{
  display:grid;
  gap:16px;
}

.grid4{
  grid-template-columns:repeat(4,minmax(0,1fr));
}

.grid3{
  grid-template-columns:repeat(3,minmax(0,1fr));
}

.grid2{
  grid-template-columns:repeat(2,minmax(0,1fr));
}

.card{
  background:linear-gradient(180deg,#10192c,#0d1525);
  border:1px solid var(--line);
  border-radius:16px;
  padding:18px;
  box-shadow:var(--shadow);
}

.card-title{
  font-size:14px;
  font-weight:900;
  margin-bottom:12px;
}

.kpi{
  font-size:28px;
  font-weight:950;
  margin-top:5px;
}

.kpi-label{
  color:var(--muted);
  font-size:11px;
  text-transform:uppercase;
  letter-spacing:.8px;
}

.hero{
  background:
    radial-gradient(circle at 80% 20%,rgba(0,212,255,.13),transparent 35%),
    radial-gradient(circle at 20% 0%,rgba(124,92,255,.18),transparent 40%),
    linear-gradient(135deg,#10192c,#0c1425);
  border:1px solid #273657;
  border-radius:20px;
  padding:24px;
  margin-bottom:18px;
}

.hero h1{
  margin:0;
  font-size:30px;
}

.hero p{
  color:#aab7ca;
  max-width:900px;
  line-height:1.6;
}

.badges{
  display:flex;
  gap:8px;
  flex-wrap:wrap;
  margin-top:14px;
}

.badge{
  display:inline-flex;
  align-items:center;
  padding:6px 10px;
  border-radius:999px;
  background:#101c31;
  border:1px solid #263653;
  color:#b9c8dc;
  font-size:11px;
  font-weight:800;
}

.badge.accent{
  background:#241c51;
  color:#dcd5ff;
  border-color:#5547a4;
}

.badge.green{
  background:#0d3324;
  color:#8af0b6;
  border-color:#196443;
}

/* FORM */

.field{
  margin-bottom:14px;
}

.field label{
  display:block;
  font-size:11px;
  font-weight:900;
  color:#aebbd0;
  margin-bottom:7px;
  text-transform:uppercase;
  letter-spacing:.5px;
}

input,
select,
textarea{
  width:100%;
  color:#fff;
  background:#0a1222;
  border:1px solid #263653;
  border-radius:10px;
  padding:11px 12px;
  outline:none;
}

input:focus,
select:focus,
textarea:focus{
  border-color:#6254d9;
  box-shadow:0 0 0 3px rgba(98,84,217,.12);
}

textarea{
  min-height:130px;
  resize:vertical;
  line-height:1.5;
}

.form-actions{
  display:flex;
  gap:9px;
  flex-wrap:wrap;
}

/* SCENES */

.scene{
  border:1px solid var(--line);
  border-radius:16px;
  background:#0d1628;
  overflow:hidden;
  margin-bottom:14px;
}

.scene-head{
  padding:13px 15px;
  background:#111c31;
  border-bottom:1px solid var(--line);
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:10px;
}

.scene-number{
  font-weight:950;
}

.scene-time{
  color:#8fa2bd;
  font-size:12px;
}

.scene-body{
  padding:15px;
}

.scene-meta{
  display:flex;
  gap:7px;
  flex-wrap:wrap;
  margin-bottom:12px;
}

.scene-cols{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:14px;
}

.meta-box{
  padding:11px;
  background:#091121;
  border:1px solid #1e2b44;
  border-radius:10px;
}

.meta-box strong{
  display:block;
  font-size:10px;
  color:#8092ad;
  text-transform:uppercase;
  margin-bottom:5px;
}

.meta-box span{
  font-size:12px;
  line-height:1.5;
}

.dialogue{
  background:#101b30;
  border:1px solid #283a5c;
  border-radius:11px;
  padding:13px;
  margin-top:12px;
}

.dialogue-title{
  font-size:10px;
  color:#8ea1bd;
  text-transform:uppercase;
  font-weight:900;
  margin-bottom:7px;
}

.dialogue-text{
  font-size:15px;
  line-height:1.55;
}

/* PROMPTS */

.prompt-box{
  position:relative;
  margin-bottom:14px;
}

.prompt-box textarea{
  min-height:220px;
  padding-right:75px;
  font-size:12px;
}

.copy-btn{
  position:absolute;
  top:8px;
  right:8px;
}

/* CHARACTER */

.character{
  border:1px solid var(--line);
  border-radius:15px;
  padding:16px;
  background:#0d1628;
}

.character-id{
  font-size:10px;
  color:#6f85a5;
  font-weight:900;
}

.character-name{
  font-size:20px;
  font-weight:950;
  margin:4px 0 9px;
}

.character-desc{
  color:#a8b5c8;
  font-size:12px;
  line-height:1.6;
}

/* EMPTY */

.empty{
  text-align:center;
  padding:55px 20px;
  color:#7f91aa;
}

/* TABLE */

.table-wrap{
  overflow-x:auto;
}

table{
  width:100%;
  border-collapse:collapse;
  min-width:700px;
}

th,
td{
  padding:10px;
  border-bottom:1px solid #1e2b43;
  text-align:left;
  font-size:12px;
}

th{
  color:#8ea0ba;
  font-size:10px;
  text-transform:uppercase;
}

/* MOBILE */

.mobile-menu{
  display:none;
}

@media(max-width:1000px){
  .grid4{
    grid-template-columns:repeat(2,minmax(0,1fr));
  }

  .grid3{
    grid-template-columns:repeat(2,minmax(0,1fr));
  }
}

@media(max-width:760px){
  .sidebar{
    transform:translateX(-100%);
    transition:.25s;
  }

  .sidebar.open{
    transform:translateX(0);
  }

  .main{
    width:100%;
    margin-left:0;
  }

  .mobile-menu{
    display:block;
  }

  .topbar{
    padding:0 12px;
  }

  .content{
    padding:14px;
  }

  .hero{
    padding:18px;
  }

  .hero h1{
    font-size:23px;
  }

  .grid4,
  .grid3,
  .grid2,
  .scene-cols{
    grid-template-columns:1fr;
  }

  .top-title{
    font-size:14px;
  }

  .top-actions .btn:not(.mobile-menu){
    padding:8px 9px;
    font-size:11px;
  }
}

/* PRINT */

@media print{
  .sidebar,
  .topbar,
  .form-actions,
  .copy-btn{
    display:none!important;
  }

  .main{
    margin:0;
    width:100%;
  }

  body{
    background:#fff;
    color:#000;
  }
}
</style>
</head>

/* =========================================================

========================================================= */

function $(id){
  return document.getElementById(id);
}

function escapeHTML(str){
  return String(str ?? "")
    .replace(/&/g,"&amp;")
    .replace(/</g,"&lt;")
    .replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;")
    .replace(/'/g,"&#039;");
}

function formatTime(seconds){
  seconds = Number(seconds) || 0;
  const m = Math.floor(seconds / 60);
  const s = Math.floor(seconds % 60);
  return String(m).padStart(2,"0") + ":" + String(s).padStart(2,"0");
}

function srtTime(seconds){
  seconds = Number(seconds) || 0;

  const h = Math.floor(seconds / 3600);
  const m = Math.floor((seconds % 3600) / 60);
  const s = Math.floor(seconds % 60);
  const ms = Math.round((seconds % 1) * 1000);

  return `${String(h).padStart(2,"0")}:${String(m).padStart(2,"0")}:${String(s).padStart(2,"0")},${String(ms).padStart(3,"0")}`;
}

function randomItem(arr){
  return arr[Math.floor(Math.random()*arr.length)];
}

function cleanSubtitle(text){
  return String(text || "")
    .replace(/^(Emma|David|Sarah|Leo|C1|C2|C3|C4)\s*:\s*/i,"")
    .replace(/^(Emma|David|Sarah|Leo|C1|C2|C3|C4)\s*-\s*/i,"")
    .trim();
}

function getChar(id){
  return characters.find(x=>x.id===id) || characters[0];
}

function getLocation(id){
  return locations.find(x=>x.id===id) || locations[0];
}

function saveState(){
  localStorage.setItem(APP_KEY,JSON.stringify(state));
  updateStatus();
}

function loadState(){

  try{

    const raw = localStorage.getItem(APP_KEY);

    if(!raw){
      saveState();
      return;
    }

    const saved = JSON.parse(raw);

    state = {
      ...state,
      ...saved
    };

    /*
      VERSION MIGRATION:
      Old V3 projects used 8 seconds as the default.
      Upgrade old default projects to 10 seconds.
      New user-selected values are preserved.
    */

    if(saved.version !== "4.0"){
      if(Number(saved.duration) === 8 || !saved.duration){
        state.duration = 10;
      }

      state.version = "4.0";
      saveState();
    }

    if(!Array.isArray(state.scenes)){
      state.scenes = [];
    }

  }catch(err){

    console.warn("State load error",err);

    state = {
      version:"4.0",
      storyTitle:"A Family Trip to the Airport",
      topic:"A family going to the airport",
      category:"travel",
      level:"A1 Beginner",
      duration:10,
      scenesCount:10,
      idea:"",
      scenes:[]
    };
  }
}

function updateStatus(){

  const count = state.scenes.length;

  if($("sideSceneCount")){
    $("sideSceneCount").textContent = `${count} Scenes`;
  }

  if($("sideDuration")){
    $("sideDuration").textContent =
      `${count ? count * Number(state.duration || 10) : 100} sec target`;
  }
}

function createDefaultScenes(){

  const d = Number(state.duration) || 10;
  const topic = state.topic || "A Family Trip";

  const plan = scenePlanForTopic(topic);

  state.scenes = plan.slice(0,10).map((p,index)=>{

    const start = index * d;
    const end = start + d;

    return {
      id:index+1,
      start,
      end,
      duration:d,
      chars:p.chars,
      location:p.loc,
      action:p.action,
      emotion:p.emotion,
      camera:p.camera,
      dialogue:createDialogue(topic,index,p.chars)
    };

  });

  saveState();
}

function randomStory(){

  const item = randomItem(storyTopics);

  state.category = item[0];
  state.topic = item[1];

  state.storyTitle = item[1];

  const ideas = [
    "A simple everyday situation becomes an unexpected story.",
    "The characters face a small problem and solve it together.",
    "A surprising moment creates curiosity and a meaningful ending.",
    "The story begins normally but something unexpected changes the day.",
    "A small mistake becomes an important life lesson.",
    "A simple journey turns into a memorable experience.",
    "The characters discover something they did not expect.",
    "A small act creates a bigger emotional moment."
  ];

  state.idea = randomItem(ideas);

  createDefaultScenes();

  showPage("story");

  setTimeout(()=>{
    renderCurrentPage();
  },20);

  saveState();
}

   GENERATE
========================================================= */

function generateStory(){

  const title = $("storyTitleInput")?.value?.trim();
  const topic = $("topicInput")?.value?.trim();
  const category = $("categoryInput")?.value || "daily";
  const level = $("levelInput")?.value || "A1 Beginner";
  const duration = Number($("sceneDuration")?.value || 10);
  const count = Number($("sceneCount")?.value || 10);

  if(title) state.storyTitle = title;
  if(topic) state.topic = topic;

  state.category = category;
  state.level = level;
  state.duration = duration;
  state.scenesCount = count;

  state.idea =
    $("storyIdeaInput")?.value?.trim() ||
    "A simple situation becomes an interesting international English story with a clear beginning, middle and ending.";

  createDefaultScenes();

  showPage("scenes");
}

function randomTopicFromForm(){

  const item = randomItem(storyTopics);

  if($("storyTitleInput")){
    $("storyTitleInput").value = item[1];
  }

  if($("topicInput")){
    $("topicInput").value = item[1];
  }

  if($("categoryInput")){
    $("categoryInput").value = item[0];
  }

  if($("storyIdeaInput")){
    $("storyIdeaInput").value =
      "A " + item[0] +
      " story designed for international English learners with curiosity,
      simple dialogue and a satisfying ending.";
  }

}

let currentPage = "dashboard";

const pageTitles = {
  dashboard:"AUNG AI STORY VIDEO PRO",
  story:"International Story Generator",
  characters:"Master Character Bible",
  locations:"Location Library",
  scenes:"Scene Planner",
  images:"Image Prompts",
  videos:"Google Flow / Veo Video Prompts",
  subtitles:"English Subtitles / SRT",
  youtube:"YouTube Publishing Pack",
  backup:"Project Backup"
};

function showPage(page){

  currentPage = page;

  document.querySelectorAll(".nav button").forEach(btn=>{
    btn.classList.toggle("active",btn.dataset.page===page);
  });

  if($("topTitle")){
    $("topTitle").textContent = pageTitles[page] || "AUNG AI STORY VIDEO PRO";
  }

  renderCurrentPage();

  const side = $("sidebar");

  if(side){
    side.classList.remove("open");
  }
}

function renderCurrentPage(){

  const el = $("appContent");

  if(!el) return;

  switch(currentPage){

    case "dashboard":
      el.innerHTML = renderDashboard();
      break;

    case "story":
      el.innerHTML = renderStory();
      break;

    case "characters":
      el.innerHTML = renderCharacters();
      break;

    case "locations":
      el.innerHTML = renderLocations();
      break;

    case "scenes":
      el.innerHTML = renderScenes();
      break;

    case "images":
      el.innerHTML = renderImages();
      break;

    case "videos":
      el.innerHTML = renderVideos();
      break;

    case "subtitles":
      el.innerHTML = renderSubtitles();
      break;

    case "youtube":
      el.innerHTML = renderYouTube();
      break;

    case "backup":
      el.innerHTML = renderBackup();
      break;

    default:
      el.innerHTML = renderDashboard();
  }

  updateStatus();
}

/* =========================================================
   COPY
========================================================= */

async function copyText(id){

  const el = $(id);

  if(!el) return;

  const text = el.value ?? el.textContent ?? "";

  try{

    await navigator.clipboard.writeText(text);

    const btn = document.querySelector(`[onclick="copyText('${id}')"]`);

    if(btn){

      const old = btn.textContent;

      btn.textContent = "Copied ✓";

      setTimeout(()=>{
        btn.textContent = old;
      },1200);

    }

  }catch(err){

    el.select();
    document.execCommand("copy");

  }
}

/* =========================================================
   DOWNLOAD SRT
========================================================= */

function downloadSRT(){

  const blob = new Blob(
    [buildSRT()],
    {type:"text/plain;charset=utf-8"}
  );

  const url = URL.createObjectURL(blob);

  const a = document.createElement("a");

  a.href = url;
  a.download =
    `${state.storyTitle.replace(/[^a-z0-9]+/gi,"_")}.srt`;

  document.body.appendChild(a);
  a.click();
  a.remove();

  URL.revokeObjectURL(url);
}

/* =========================================================
   EXPORT
========================================================= */

function exportProject(){

  const data = {
    app:"AUNG AI STORY VIDEO PRO",
    version:state.version,
    exportedAt:new Date().toISOString(),
    state
  };

  const blob = new Blob(
    [JSON.stringify(data,null,2)],
    {type:"application/json"}
  );

  const url = URL.createObjectURL(blob);

  const a = document.createElement("a");

  a.href = url;

  a.download =
    `${state.storyTitle.replace(/[^a-z0-9]+/gi,"_")}_project.json`;

  document.body.appendChild(a);
  a.click();
  a.remove();

  URL.revokeObjectURL(url);
}

/* =========================================================
   IMPORT
========================================================= */

function importProject(event){

  const file = event.target.files?.[0];

  if(!file) return;

  const reader = new FileReader();

  reader.onload = ()=>{

    try{

      const data = JSON.parse(reader.result);

      if(data.state){

        state = {
          ...state,
          ...data.state
        };

      }else{

        state = {
          ...state,
          ...data
        };

      }

      state.version = "4.0";

      if(!state.duration){
        state.duration = 10;
      }

      if(!Array.isArray(state.scenes)){
        state.scenes = [];
      }

      saveState();
      renderCurrentPage();

      alert("Project imported successfully");

    }catch(err){

      alert("Invalid project JSON file");

    }

  };

  reader.readAsText(file);
}

function resetProject(){

  const ok = confirm(

  if(!ok) return;

  localStorage.removeItem(APP_KEY);

  state = {
    version:"4.0",
    storyTitle:"A Family Trip to the Airport",
    topic:"A family going to the airport",
    category:"travel",
    level:"A1 Beginner",
    duration:10,
    scenesCount:10,
    idea:"",

  };

}
