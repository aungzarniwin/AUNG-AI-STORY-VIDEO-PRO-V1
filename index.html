<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">

<title>AUNG AI STORY VIDEO PRO V4.1</title>

<style>
:root{
  --bg:#070b16;
  --panel:#0d1322;
  --panel2:#111a2c;
  --line:#202b42;
  --text:#f5f7fb;
  --muted:#8e9ab0;
  --primary:#7c5cff;
  --primary2:#9a82ff;
  --green:#18c98b;
  --yellow:#f5bd45;
  --red:#ff5d6c;
  --blue:#3da5ff;
  --radius:16px;
}

*{
  box-sizing:border-box;
  -webkit-tap-highlight-color:transparent;
}

html,body{
  margin:0;
  padding:0;
  width:100%;
  min-height:100%;
  background:var(--bg);
  color:var(--text);
  font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
}

button,input,textarea,select{
  font:inherit;
}

button{
  cursor:pointer;
}

.app{
  min-height:100vh;
  display:flex;
}

/* ================= SIDEBAR ================= */

.sidebar{
  width:250px;
  min-width:250px;
  height:100vh;
  position:fixed;
  left:0;
  top:0;
  z-index:100;
  background:#090e1a;
  border-right:1px solid var(--line);
  padding:18px 14px;
  overflow-y:auto;
}

.logo{
  padding:8px 10px 20px;
}

.logo-main{
  font-size:18px;
  font-weight:950;
  letter-spacing:.3px;
}

.logo-sub{
  color:var(--muted);
  font-size:11px;
  margin-top:4px;
}

.nav{
  display:flex;
  flex-direction:column;
  gap:6px;
}

.nav button{
  border:1px solid transparent;
  background:transparent;
  color:#aeb8ca;
  width:100%;
  text-align:left;
  padding:12px 13px;
  border-radius:11px;
  font-weight:750;
  transition:.2s;
}

.nav button:hover{
  background:#11192a;
  color:#fff;
}

.nav button.active{
  background:linear-gradient(135deg,#261e58,#171c38);
  border-color:#44388a;
  color:#fff;
}

.side-bottom{
  margin-top:20px;
  padding:12px;
  border:1px solid var(--line);
  border-radius:14px;
  background:#0c1220;
}

.side-small{
  color:var(--muted);
  font-size:11px;
  line-height:1.5;
}

/* ================= MAIN ================= */

.main{
  margin-left:250px;
  width:calc(100% - 250px);
  min-width:0;
}

/* ================= TOPBAR FIX ================= */

.topbar{
  position:sticky;
  top:0;
  z-index:80;
  min-height:72px;
  width:100%;
  padding:10px 22px;
  background:rgba(7,11,22,.96);
  border-bottom:1px solid var(--line);
  backdrop-filter:blur(18px);
}

.topbar-inner{
  min-height:50px;
  display:grid;
  grid-template-columns:minmax(0,1fr) auto;
  align-items:center;
  gap:14px;
}

.top-left{
  min-width:0;
  display:flex;
  align-items:center;
  gap:10px;
}

.mobile-menu{
  display:none;
}

.brand-block{
  min-width:0;
}

.brand{
  font-size:18px;
  font-weight:950;
  line-height:1.15;
  color:#fff;
  white-space:normal;
}

.page-name{
  margin-top:4px;
  color:var(--muted);
  font-size:11px;
  font-weight:700;
}

.top-actions{
  display:flex;
  align-items:center;
  justify-content:flex-end;
  gap:8px;
  flex-shrink:0;
}

.btn{
  border:1px solid var(--line);
  background:#101829;
  color:#eaf0fb;
  border-radius:10px;
  padding:10px 13px;
  font-weight:800;
  font-size:13px;
  transition:.18s;
}

.btn:hover{
  transform:translateY(-1px);
  border-color:#3b4b6d;
}

.btn.primary{
  background:linear-gradient(135deg,var(--primary),#5d46df);
  border-color:#816dff;
  color:white;
}

.btn.green{
  background:#103b30;
  border-color:#176d55;
}

.btn.danger{
  background:#35151c;
  border-color:#672633;
}

.btn.small{
  padding:9px 11px;
  font-size:12px;
}

.content{
  width:100%;
  max-width:1450px;
  margin:auto;
  padding:24px;
}

/* ================= COMMON ================= */

.page-head{
  margin-bottom:20px;
}

.page-head h1{
  margin:0;
  font-size:27px;
  font-weight:950;
}

.page-head p{
  margin:7px 0 0;
  color:var(--muted);
}

.grid{
  display:grid;
  grid-template-columns:repeat(4,minmax(0,1fr));
  gap:14px;
}

.grid2{
  display:grid;
  grid-template-columns:repeat(2,minmax(0,1fr));
  gap:14px;
}

.card{
  background:linear-gradient(180deg,#0e1525,#0b1120);
  border:1px solid var(--line);
  border-radius:var(--radius);
  padding:18px;
  min-width:0;
}

.card h2,
.card h3{
  margin:0 0 12px;
}

.card h2{
  font-size:18px;
}

.card h3{
  font-size:15px;
}

.stat{
  padding:17px;
}

.stat-label{
  color:var(--muted);
  font-size:11px;
  font-weight:800;
  text-transform:uppercase;
}

.stat-value{
  margin-top:7px;
  font-size:25px;
  font-weight:950;
}

.stat-sub{
  color:var(--muted);
  font-size:11px;
  margin-top:4px;
}

.label{
  display:block;
  color:#b8c2d4;
  font-size:12px;
  font-weight:800;
  margin:0 0 7px;
}

.input,
textarea,
select{
  width:100%;
  border:1px solid var(--line);
  outline:none;
  background:#080e1b;
  color:#fff;
  border-radius:10px;
  padding:11px 12px;
}

textarea{
  resize:vertical;
  min-height:110px;
}

.input:focus,
textarea:focus,
select:focus{
  border-color:#6253d8;
}

.field{
  margin-bottom:14px;
}

.row{
  display:flex;
  align-items:center;
  gap:9px;
  flex-wrap:wrap;
}

.badge{
  display:inline-flex;
  align-items:center;
  border:1px solid var(--line);
  background:#0d1627;
  color:#c5cede;
  border-radius:999px;
  padding:5px 9px;
  font-size:10px;
  font-weight:850;
}

.badge.purple{
  color:#c8beff;
  border-color:#493d9a;
}

.badge.green{
  color:#73e5ba;
  border-color:#205f4d;
}

.badge.blue{
  color:#7cc5ff;
  border-color:#285b86;
}

.muted{
  color:var(--muted);
}

.empty{
  padding:35px 15px;
  text-align:center;
  color:var(--muted);
}

/* ================= DASHBOARD ================= */

.hero{
  padding:24px;
  border:1px solid #30275f;
  border-radius:20px;
  background:
    radial-gradient(circle at 85% 20%,rgba(124,92,255,.22),transparent 32%),
    linear-gradient(135deg,#10162c,#0b1120);
}

.hero h1{
  margin:0;
  font-size:32px;
}

.hero p{
  color:#aab5c9;
  line-height:1.6;
  max-width:760px;
}

.topic-box{
  margin-top:17px;
  padding:16px;
  border:1px solid #292f4a;
  border-radius:14px;
  background:#080e1a;
}

.topic-text{
  font-size:19px;
  font-weight:900;
  line-height:1.4;
}

/* ================= SCENES ================= */

.scene{
  border:1px solid var(--line);
  border-radius:15px;
  background:#0c1321;
  overflow:hidden;
  margin-bottom:13px;
}

.scene-head{
  padding:12px 14px;
  border-bottom:1px solid var(--line);
  display:flex;
  justify-content:space-between;
  gap:10px;
  align-items:center;
}

.scene-number{
  font-weight:950;
}

.scene-body{
  padding:14px;
}

.scene-grid{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:12px;
}

.prompt{
  background:#070c17;
  border:1px solid #1d2940;
  border-radius:10px;
  padding:12px;
  font-size:12px;
  line-height:1.65;
  white-space:pre-wrap;
  color:#cbd4e4;
}

.prompt-title{
  color:#8d9db7;
  font-size:10px;
  font-weight:900;
  text-transform:uppercase;
  margin-bottom:7px;
}

.copy-row{
  margin-top:8px;
  display:flex;
  justify-content:flex-end;
}

/* ================= TABLE ================= */

.table-wrap{
  width:100%;
  overflow-x:auto;
}

table{
  width:100%;
  min-width:650px;
  border-collapse:collapse;
}

th,td{
  padding:11px;
  border-bottom:1px solid var(--line);
  text-align:left;
  font-size:12px;
}

th{
  color:#9eabc0;
  font-size:10px;
  text-transform:uppercase;
}

/* ================= CHARACTER ================= */

.character-card{
  display:flex;
  gap:13px;
  align-items:flex-start;
}

.avatar{
  width:52px;
  height:52px;
  min-width:52px;
  border-radius:14px;
  background:linear-gradient(135deg,#2c225f,#182a45);
  display:grid;
  place-items:center;
  font-weight:950;
  font-size:18px;
}

.character-name{
  font-size:16px;
  font-weight:950;
}

.character-role{
  color:var(--muted);
  font-size:11px;
  margin-top:2px;
}

.character-desc{
  margin-top:9px;
  color:#b8c3d5;
  font-size:12px;
  line-height:1.6;
}

/* ================= MODAL ================= */

.modal{
  position:fixed;
  inset:0;
  z-index:500;
  background:rgba(0,0,0,.72);
  display:none;
  align-items:center;
  justify-content:center;
  padding:18px;
}

.modal.show{
  display:flex;
}

.modal-box{
  width:min(700px,100%);
  max-height:90vh;
  overflow:auto;
  background:#0d1423;
  border:1px solid var(--line);
  border-radius:18px;
  padding:20px;
}

.modal-head{
  display:flex;
  justify-content:space-between;
  gap:10px;
  align-items:center;
  margin-bottom:15px;
}

/* ================= TOAST ================= */

.toast{
  position:fixed;
  left:50%;
  bottom:20px;
  transform:translate(-50%,20px);
  opacity:0;
  pointer-events:none;
  z-index:1000;
  background:#121b2d;
  border:1px solid #344461;
  color:#fff;
  padding:11px 16px;
  border-radius:11px;
  font-size:12px;
  font-weight:800;
  transition:.25s;
}

.toast.show{
  opacity:1;
  transform:translate(-50%,0);
}

/* ================= MOBILE ================= */

@media(max-width:900px){

  .sidebar{
    transform:translateX(-105%);
    transition:.25s;
    box-shadow:20px 0 50px rgba(0,0,0,.35);
  }

  .sidebar.open{
    transform:translateX(0);
  }

  .main{
    margin-left:0;
    width:100%;
  }

  .mobile-menu{
    display:block;
    padding:9px 11px;
    flex-shrink:0;
  }

  .topbar{
    padding:10px 12px;
  }

  .topbar-inner{
    grid-template-columns:1fr;
    gap:9px;
  }

  .top-left{
    width:100%;
  }

  .brand{
    font-size:16px;
  }

  .top-actions{
    width:100%;
    justify-content:flex-start;
    overflow:visible;
  }

  .top-actions .btn{
    flex:1;
    min-width:0;
    white-space:nowrap;
  }

  .content{
    padding:15px;
  }

  .grid{
    grid-template-columns:repeat(2,minmax(0,1fr));
  }

  .grid2{
    grid-template-columns:1fr;
  }

  .scene-grid{
    grid-template-columns:1fr;
  }
}

@media(max-width:520px){

  .brand{
    font-size:15px;
    line-height:1.25;
  }

  .page-name{
    font-size:10px;
  }

  .content{
    padding:12px;
  }

  .grid{
    grid-template-columns:1fr 1fr;
    gap:9px;
  }

  .stat{
    padding:13px;
  }

  .stat-value{
    font-size:21px;
  }

  .hero{
    padding:18px;
  }

  .hero h1{
    font-size:25px;
  }

  .topic-text{
    font-size:16px;
  }

  .top-actions{
    gap:6px;
  }

  .top-actions .btn{
    padding:10px 7px;
    font-size:11px;
  }
}

@media(max-width:360px){

  .brand{
    font-size:14px;
  }

  .top-actions .btn{
    font-size:10px;
    padding:9px 5px;
  }
}
</style>
</head>

/* =========================================================

function $(id){
  return document.getElementById(id);
}

function esc(value){
  return String(value ?? "")
    .replaceAll("&","&amp;")
    .replaceAll("<","&lt;")
    .replaceAll(">","&gt;")
    .replaceAll('"',"&quot;")
    .replaceAll("'","&#039;");
}

function saveState(){
  localStorage.setItem(APP_KEY,JSON.stringify(state));
}

function loadState(){

  try{

    const raw=localStorage.getItem(APP_KEY);

    if(raw){
      const saved=JSON.parse(raw);
      state={...state,...saved};
    }

  }catch(e){
    console.warn("State load error",e);
  }

  if(!state.topic){
    state.topic="First Day in a New City";
  }

  if(!state.duration){
    state.duration=10;
  }

  if(!state.scenesCount){
    state.scenesCount=10;
  }
}

function toast(message){

  const el=$("toast");

  el.textContent=message;
  el.classList.add("show");

  clearTimeout(window.__toast);

  window.__toast=setTimeout(()=>{
    el.classList.remove("show");
  },2200);
}

function copyText(text){

  navigator.clipboard.writeText(text)
    .then(()=>toast("Copied to clipboard"))
    .catch(()=>{
      const ta=document.createElement("textarea");
      ta.value=text;
      document.body.appendChild(ta);
      ta.select();
      document.execCommand("copy");
      ta.remove();
      toast("Copied");
    });
}

function getCharacter(id){
  return characters.find(x=>x.id===id) || characters[0];

function getLocation(id){

/* =========================================================
   SCENES
========================================================= */

function createScenes(){

  const topic=state.topic || "First Day in a New City";

  const plan=planForTopic(topic);

  const count=Math.max(
    1,
    Math.min(20,Number(state.scenesCount)||10)
  );

  const result=[];

  for(let i=0;i<count;i++){

    const base=plan[i % plan.length];

    const dialogue=dialogueFor(i,topic);

    const locationId=base[2];

    const charactersForScene =
      state.characters.length
      ? state.characters
      : ["C1","C2","C3"];

    result.push({

      id:i+1,

      title:base[0],

      narration:base[1],

      locationId,

      location:getLocation(locationId),

      duration:Number(state.duration)||10,

      characterIds:charactersForScene,

      dialogue,

      imagePrompt:"",

      videoPrompt:"",

      subtitle:dialogue.map(x=>x[1]).join(" "),

      generated:false

    });

  }

  return result;
}

function generateStory(){

  if(!state.topic){
    randomStory();
    return;
  }

  state.title=makeTitle(state.topic);

  state.scenes=createScenes();

  state.scenes.forEach(scene=>{

    scene.imagePrompt=buildImagePrompt(scene);
    scene.videoPrompt=buildVideoPrompt(scene);
    scene.generated=true;

  });

  state.generated=true;
  state.createdAt=new Date().toISOString();

  saveState();

  showPage("scenes");

  toast("Story generated successfully");

}

/* =========================================================
   SRT
========================================================= */

function formatTime(seconds){

  const h=Math.floor(seconds/3600);

  const m=Math.floor((seconds%3600)/60);

  const s=Math.floor(seconds%60);

  const ms=Math.floor((seconds%1)*1000);

  return [
    String(h).padStart(2,"0"),
    String(m).padStart(2,"0"),
    String(s).padStart(2,"0")
  ].join(":")+"."+String(ms).padStart(3,"0");
}

function buildSRT(){

  let output="";
  let time=0;

  state.scenes.forEach((scene,i)=>{

    const start=time;
    const end=time+scene.duration;

    output+=`${i+1}\n`;
    output+=`${formatTime(start)} --> ${formatTime(end)}\n`;
    output+=`${scene.subtitle}\n\n`;

    time=end;

  });

  return output;
}

function renderBackup(){

  $("appContent").innerHTML=`

        >

        </button>

      </div>

      <div class="card">

        <p class="muted">
          Restore a previously exported JSON project.
        </p>

        <input
          id="importFile"
          type="file"
          accept=".json"
          class="input"
        >

        <button
          class="btn green"
          style="margin-top:9px"
          onclick="importProject()"
        >
          📥 Import JSON
        </button>

      </div>

    </div>

    <div class="card" style="margin-top:15px">

      <h2>Reset</h2>

      <p class="muted">
        Remove the current project and start again.
      </p>

      <button
        class="btn danger"
        onclick="resetProject()"
      >
        🗑 Reset Project
      </button>

    </div>
  `;
}

function exportProject(){

  const data=JSON.stringify(state,null,2);

  const blob=new Blob(
    [data],
    {type:"application/json"}
  );

  const url=URL.createObjectURL(blob);

  const a=document.createElement("a");

  a.href=url;

  a.download="aung-ai-story-video-project.json";

  document.body.appendChild(a);

  a.click();

  a.remove();

  URL.revokeObjectURL(url);

  toast("Project exported");
}

function importProject(){

  const input=$("importFile");

  if(!input || !input.files.length){
    toast("Choose a JSON file first");
    return;
  }

  const reader=new FileReader();

  reader.onload=()=>{

    try{

      const data=JSON.parse(reader.result);

      state={
        ...state,
        ...data,
        version:"4.1"
      };

      saveState();

      renderPage();

      toast("Project imported");

    }catch(e){

      toast("Invalid project file");

    }

  };

  reader.readAsText(input.files[0]);
}

function resetProject(){

  if(!confirm("Reset the current project?")) return;

  localStorage.removeItem(APP_KEY);

  state={
    version:"4.1",
    page:"dashboard",
    topic:"First Day in a New City",
    title:"",
    genre:"Daily Life",
    duration:10,
    scenesCount:10,
    characters:["C1","C2","C3"],
    scenes:[],
    generated:false,
    createdAt:new Date().toISOString()
  };

  saveState();

  showPage("dashboard");

  toast("Project reset");
}

/* =========================================================
   PAGE RENDERER
========================================================= */

function renderPage(){

  /*
    IMPORTANT:
    Only #appContent is replaced.
    The TOPBAR is never overwritten.
    Therefore:
    AUNG AI STORY VIDEO PRO
    🎲 Random Story
    ⚡ Generate
    always remain in the DOM.
  */

  switch(state.page){

    case "story":
      renderStory();
      break;

    case "characters":
      renderCharacters();
      break;

    case "locations":
      renderLocations();
      break;

    case "scenes":
      renderScenes();
      break;

    case "images":
      renderImages();
      break;

    case "videos":
      renderVideos();
      break;

    case "subtitles":
      renderSubtitles();
      break;

    case "youtube":
      renderYouTube();
      break;

    case "backup":
      renderBackup();
      break;

    default:
      renderDashboard();

  }

}

/* =========================================================
   INIT
========================================================= */

renderPage();
