<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,viewport-fit=cover">
<meta name="theme-color" content="#0b1020">
<title>AUNG AI STORY VIDEO PRO</title>

<style>
:root{
  --bg:#080c16;
  --panel:#101728;
  --panel2:#151d30;
  --line:#273149;
  --text:#f5f7fb;
  --muted:#8e9ab3;
  --accent:#7c5cff;
  --accent2:#19d3ae;
  --danger:#ff5d73;
  --warning:#ffbd4a;
  --shadow:0 18px 45px rgba(0,0,0,.28);
  --radius:18px;
}

*{
  box-sizing:border-box;
  -webkit-tap-highlight-color:transparent;
}

html,body{
  margin:0;
  padding:0;
  background:var(--bg);
  color:var(--text);
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;
}

body{
  min-height:100vh;
}

button,
input,
textarea,
select{
  font:inherit;
}

button{
  cursor:pointer;
}

.topbar{
  position:sticky;
  top:0;
  z-index:1000;
  min-height:70px;
  background:rgba(8,12,22,.96);
  backdrop-filter:blur(18px);
  border-bottom:1px solid var(--line);
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:14px;
  padding:12px 16px;
}

.brand{
  min-width:0;
}

.brand h1{
  margin:0;
  font-size:17px;
  letter-spacing:.4px;
  font-weight:800;
}

.brand span{
  display:block;
  margin-top:3px;
  color:var(--muted);
  font-size:11px;
}

.top-actions{
  display:flex;
  gap:8px;
  flex-wrap:wrap;
  justify-content:flex-end;
}

.btn{
  border:1px solid var(--line);
  background:var(--panel2);
  color:var(--text);
  padding:10px 13px;
  border-radius:12px;
  font-weight:700;
  font-size:13px;
  transition:.18s;
}

.btn:hover{
  transform:translateY(-1px);
  border-color:#4a5877;
}

.btn.primary{
  background:linear-gradient(135deg,#7656ff,#5b42d9);
  border-color:#8068ff;
}

.btn.green{
  background:linear-gradient(135deg,#13b995,#0b8c73);
  border-color:#19d3ae;
}

.btn.danger{
  background:#351621;
  border-color:#63303c;
  color:#ff9aaa;
}

.btn.small{
  padding:8px 10px;
  font-size:12px;
}

.layout{
  display:flex;
  min-height:calc(100vh - 70px);
}

.sidebar{
  width:235px;
  flex:0 0 235px;
  border-right:1px solid var(--line);
  background:#0b1120;
  padding:14px 10px;
  position:sticky;
  top:70px;
  height:calc(100vh - 70px);
  overflow:auto;
}

.nav-title{
  color:#5f6c85;
  font-size:10px;
  text-transform:uppercase;
  letter-spacing:1.2px;
  padding:12px 10px 7px;
}

.nav-btn{
  width:100%;
  border:0;
  background:transparent;
  color:#aab4c9;
  text-align:left;
  padding:11px 12px;
  border-radius:11px;
  margin-bottom:3px;
  font-weight:650;
  font-size:13px;
}

.nav-btn:hover,
.nav-btn.active{
  color:white;
  background:#172038;
}

.main{
  flex:1;
  min-width:0;
  padding:20px;
  max-width:1500px;
  margin:auto;
  width:100%;
}

.page-title{
  display:flex;
  justify-content:space-between;
  align-items:flex-start;
  gap:15px;
  margin-bottom:20px;
}

.page-title h2{
  margin:0;
  font-size:24px;
}

.page-title p{
  margin:6px 0 0;
  color:var(--muted);
  font-size:13px;
}

.grid{
  display:grid;
  grid-template-columns:repeat(12,1fr);
  gap:14px;
}

.card{
  grid-column:span 12;
  background:linear-gradient(180deg,rgba(21,29,48,.96),rgba(13,19,33,.96));
  border:1px solid var(--line);
  border-radius:var(--radius);
  box-shadow:var(--shadow);
  padding:17px;
  min-width:0;
}

.card.half{
  grid-column:span 6;
}

.card.third{
  grid-column:span 4;
}

.card h3{
  margin:0 0 12px;
  font-size:15px;
}

.muted{
  color:var(--muted);
}

.stat-grid{
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:12px;
}

.stat{
  background:#0c1323;
  border:1px solid var(--line);
  border-radius:14px;
  padding:15px;
}

.stat .label{
  color:var(--muted);
  font-size:11px;
}

.stat .value{
  margin-top:7px;
  font-size:23px;
  font-weight:850;
}

label{
  display:block;
  color:#aab4c9;
  font-size:11px;
  margin-bottom:7px;
}

input,
textarea,
select{
  width:100%;
  background:#090f1d;
  color:white;
  border:1px solid var(--line);
  border-radius:12px;
  padding:11px 12px;
  outline:none;
}

input:focus,
textarea:focus,
select:focus{
  border-color:#6953dc;
}

textarea{
  min-height:120px;
  resize:vertical;
  line-height:1.55;
}

.form-grid{
  display:grid;
  grid-template-columns:repeat(2,1fr);
  gap:13px;
}

.form-grid.three{
  grid-template-columns:repeat(3,1fr);
}

.form-item.full{
  grid-column:1/-1;
}

.actions{
  display:flex;
  flex-wrap:wrap;
  gap:8px;
  margin-top:12px;
}

.story-box{
  white-space:pre-wrap;
  line-height:1.7;
  color:#dce3f2;
}

.character-card{
  border:1px solid var(--line);
  background:#0b1221;
  border-radius:16px;
  padding:15px;
  height:100%;
}

.character-head{
  display:flex;
  justify-content:space-between;
  gap:10px;
  align-items:flex-start;
  margin-bottom:12px;
}

.character-name{
  font-size:18px;
  font-weight:850;
}

.badge{
  display:inline-flex;
  align-items:center;
  border:1px solid #35405b;
  background:#141d31;
  color:#bac5d9;
  border-radius:999px;
  padding:5px 8px;
  font-size:10px;
  font-weight:750;
}

.dna{
  white-space:pre-wrap;
  color:#b8c2d6;
  font-size:12px;
  line-height:1.55;
}

.lock-box{
  border:1px solid #493d83;
  background:linear-gradient(135deg,#15122e,#10172b);
  border-radius:15px;
  padding:14px;
  margin-top:12px;
}

.lock-box strong{
  color:#bdaeff;
}

.scene-card{
  margin-bottom:15px;
  border:1px solid #303b57;
  background:#0c1322;
  border-radius:17px;
  overflow:hidden;
}

.scene-head{
  padding:14px;
  background:#121b2f;
  border-bottom:1px solid var(--line);
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:10px;
}

.scene-head-left{
  min-width:0;
}

.scene-number{
  font-size:12px;
  color:#9eabca;
}

.scene-title{
  font-size:17px;
  font-weight:850;
  margin-top:3px;
}

.scene-body{
  padding:14px;
}

.scene-meta{
  display:flex;
  flex-wrap:wrap;
  gap:6px;
  margin-bottom:13px;
}

.scene-section{
  margin-top:13px;
}

.scene-section h4{
  margin:0 0 7px;
  font-size:11px;
  color:#9da9c0;
  text-transform:uppercase;
  letter-spacing:.7px;
}

.scene-text{
  white-space:pre-wrap;
  line-height:1.55;
  font-size:12px;
  color:#d7deeb;
  background:#080e1b;
  border:1px solid #202a40;
  border-radius:11px;
  padding:11px;
}

.copy-row{
  display:flex;
  flex-wrap:wrap;
  gap:7px;
  margin-top:8px;
}

.prompt{
  font-family:ui-monospace,SFMono-Regular,Menlo,Monaco,Consolas,monospace;
  font-size:11px;
  line-height:1.6;
  color:#cbd5e8;
}

.topic-list{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:8px;
}

.topic{
  padding:11px;
  background:#0b1220;
  border:1px solid var(--line);
  border-radius:11px;
  color:#c5cee0;
  font-size:12px;
  cursor:pointer;
}

.topic:hover{
  border-color:#6650d5;
  color:white;
}

.notice{
  padding:12px 13px;
  border-radius:12px;
  background:#10192a;
  border:1px solid #283754;
  color:#b7c2d6;
  font-size:12px;
  line-height:1.55;
}

.code{
  white-space:pre-wrap;
  font-family:ui-monospace,SFMono-Regular,Menlo,monospace;
  font-size:11px;
  line-height:1.55;
  background:#060a12;
  border:1px solid #20283a;
  border-radius:12px;
  padding:13px;
  max-height:600px;
  overflow:auto;
}

.toast{
  position:fixed;
  bottom:20px;
  left:50%;
  transform:translateX(-50%) translateY(20px);
  z-index:3000;
  background:#f3f6ff;
  color:#101522;
  padding:10px 15px;
  border-radius:999px;
  font-size:12px;
  font-weight:800;
  opacity:0;
  pointer-events:none;
  transition:.25s;
}

.toast.show{
  opacity:1;
  transform:translateX(-50%) translateY(0);
}

.empty{
  text-align:center;
  padding:45px 20px;
  color:var(--muted);
}

.progress{
  height:8px;
  background:#080d18;
  border-radius:99px;
  overflow:hidden;
  border:1px solid var(--line);
}

.progress > div{
  height:100%;
  background:linear-gradient(90deg,#7656ff,#19d3ae);
  width:0%;
}

footer{
  color:#59657d;
  text-align:center;
  padding:35px 10px;
  font-size:11px;
}

@media(max-width:950px){
  .sidebar{
    width:205px;
    flex-basis:205px;
  }

  .stat-grid{
    grid-template-columns:repeat(2,1fr);
  }

  .card.half,
  .card.third{
    grid-column:span 12;
  }

  .topic-list{
    grid-template-columns:repeat(2,1fr);
  }
}

@media(max-width:720px){
  .topbar{
    position:relative;
    align-items:flex-start;
    flex-direction:column;
    padding:12px;
  }

  .top-actions{
    width:100%;
    justify-content:flex-start;
  }

  .top-actions .btn{
    flex:1;
    min-width:0;
  }

  .layout{
    display:block;
  }

  .sidebar{
    width:100%;
    height:auto;
    position:relative;
    top:0;
    border-right:0;
    border-bottom:1px solid var(--line);
    padding:8px;
    display:flex;
    gap:5px;
    overflow-x:auto;
  }

  .nav-title{
    display:none;
  }

  .nav-btn{
    width:auto;
    white-space:nowrap;
    margin:0;
  }

  .main{
    padding:12px;
  }

  .page-title h2{
    font-size:20px;
  }

  .form-grid,
  .form-grid.three{
    grid-template-columns:1fr;
  }

  .topic-list{
    grid-template-columns:1fr;
  }

  .stat-grid{
    grid-template-columns:1fr 1fr;
  }

  .scene-head{
    align-items:flex-start;
    flex-direction:column;
  }
}
</style>
</head>

function loadState(){
  try{
    const raw=localStorage.getItem(APP_KEY);
    if(!raw) return structuredClone(defaultState);

    const parsed=JSON.parse(raw);

    return {
      ...structuredClone(defaultState),
      ...parsed,
      scenes:Array.isArray(parsed.scenes)?parsed.scenes:[]
    };
  }catch(e){
    return structuredClone(defaultState);
  }
}

function saveState(){
  localStorage.setItem(APP_KEY,JSON.stringify(state));
}

/* =========================================================
   UTILS
========================================================= */

function esc(value){
  return String(value ?? "")
    .replace(/&/g,"&amp;")
    .replace(/</g,"&lt;")
    .replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;")
    .replace(/'/g,"&#039;");
}

function uid(){
  return Math.random().toString(36).slice(2,9);
}

function toast(message){
  const el=document.getElementById("toast");
  el.textContent=message;
  el.classList.add("show");
  clearTimeout(window.__toast);
  window.__toast=setTimeout(()=>el.classList.remove("show"),1800);
}

function getCharacter(id){
  return characters.find(c=>c.id===id);
}

function getLocation(id){
  return locations.find(l=>l[0]===id) || locations[0];
}

function selectedCharacters(){
  return state.characters.map(getCharacter).filter(Boolean);
}

function selectedCharacterDNA(){
  return selectedCharacters()
    .map(c=>`\n===== ${c.id} — ${c.name} =====\n${c.dna.trim()}`)
    .join("\n");
}

function randomItem(arr){
  return arr[Math.floor(Math.random()*arr.length)];
}

function normalizeTitle(str){
  return String(str || "")
    .replace(/[<>]/g,"")
    .trim()
    .slice(0,120);
}

function createScenes(){
  const count=Math.max(5,Math.min(20,state.scenesCount||10));
  const scenes=[];

  for(let i=0;i<count;i++){

    const plan=scenePlans[i % scenePlans.length];
    const location=getLocation(plan.location);

    const charsForScene=
      i===0
        ? ["C1","C2","C3","C4"]
        : i%4===0
          ? ["C1","C2","C3"]
          : i%3===0
            ? ["C1","C3","C4"]
            : ["C1","C2","C3"];

    const selected=charsForScene
      .filter(id=>state.characters.includes(id))
      .map(getCharacter);

    const actualCharacters=selected.length
      ? selected
      : selectedCharacters();

    const dialogue=dialogueFor(i);

    const subtitle=dialogue
      .map(x=>x.text)
      .join("\n");

    const scene={
      id:uid(),
      index:i+1,
      title:`${state.title} — Scene ${i+1}`,
      duration:state.duration,
      locationId:location[0],
      location:location[1],
      environment:location[2],
      action:plan.action,
      mood:plan.mood,
      characters:actualCharacters.map(c=>c.id),
      dialogue,
      subtitle
    };

    scene.imagePrompt=buildImagePrompt(scene);
    scene.videoPrompt=buildVideoPrompt(scene);

    scenes.push(scene);
  }

  state.scenes=scenes;
}

async function copyText(text,message="Copied"){
  try{
    if(navigator.clipboard && window.isSecureContext){
      await navigator.clipboard.writeText(text);
      toast(message);
      return;
    }
  }catch(e){}

  const area=document.createElement("textarea");
  area.value=text;
  area.style.position="fixed";
  area.style.left="-9999px";
  document.body.appendChild(area);
  area.focus();
  area.select();

  try{
    document.execCommand("copy");
    toast(message);
  }catch(e){
    toast("Copy failed — please select manually");
  }

  document.body.removeChild(area);
}

function copyScene(index){
  const scene=state.scenes[index];
  if(scene) copyText(sceneBundle(scene),"Scene copied");
}

function copyDialogue(index){
  const scene=state.scenes[index];
  if(!scene) return;

  const text=scene.dialogue
    .map(d=>`${d.speaker}: "${d.text}"`)

  copyText(text,"Dialogue copied");
}

function copySubtitle(index){

function copyImagePrompt(index){

function buildSRT(){

  let output="";
  let cursor=0;

  state.scenes.forEach((scene,index)=>{

    const start=cursor;
    const end=cursor+scene.duration;

    output+=`${index+1}\n`;
    output+=`${formatSRT(start)} --> ${formatSRT(end)}\n`;
    output+=`${scene.subtitle}\n\n`;

    cursor=end;
  });

  return output.trim();
}

function formatSRT(seconds){
  const ms=0;
  const h=Math.floor(seconds/3600);
  const m=Math.floor((seconds%3600)/60);
  const s=Math.floor(seconds%60);

  return [
    String(h).padStart(2,"0"),
    String(m).padStart(2,"0"),
    String(s).padStart(2,"0")
  ].join(":")+",000";
}

function renderSubtitles(){

  if(!state.scenes.length){
    return emptyPage("Subtitles");
  }

  const srt=buildSRT();

  return `

      <button class="btn green" onclick="copyText(${JSON.stringify(srt)},'SRT copied')">
        📋 Copy SRT

      </button>
    </div>

    <div class="code" style="margin-top:14px">${esc(srt)}</div>

  </div>
  `;
}

function downloadSRT(){

  const blob=new Blob([buildSRT()],{type:"text/plain;charset=utf-8"});
  const url=URL.createObjectURL(blob);

  const a=document.createElement("a");
  a.href=url;
  a.download=(state.title||"english-story")+".srt";
  document.body.appendChild(a);

  URL.revokeObjectURL(url);

  toast("SRT downloaded");
}

function exportProject(){

  const data={
    app:"AUNG AI STORY VIDEO PRO",
    version:"5.0.0",
    exportedAt:new Date().toISOString(),
    state
  };

  const blob=new Blob(
    [JSON.stringify(data,null,2)],
    {type:"application/json"}
  );

  const url=URL.createObjectURL(blob);

  const a=document.createElement("a");
  a.href=url;
  a.download="aung-ai-story-video-pro-backup.json";
  document.body.appendChild(a);
  a.click();
  a.remove();

  URL.revokeObjectURL(url);

  toast("Backup exported");
}

function importProject(){

  const file=document.getElementById("importFile")?.files?.[0];

  if(!file){
    toast("Select a JSON file first");
    return;
  }

  const reader=new FileReader();

  reader.onload=function(){

    try{
      const parsed=JSON.parse(reader.result);

      if(parsed.state){
        state={
          ...structuredClone(defaultState),
          ...parsed.state,
          scenes:Array.isArray(parsed.state.scenes)
            ? parsed.state.scenes
            : []
        };
      }else{
        state={
          ...structuredClone(defaultState),
          ...parsed
        };
      }

      saveState();
      render();

      toast("Project imported");
    }catch(e){
      toast("Invalid backup file");
    }
  };

  reader.readAsText(file);
}

function resetProject(){

  if(!confirm("Reset this project?")) return;

  localStorage.removeItem(APP_KEY);
  state=structuredClone(defaultState);

  render();

  toast("Project reset");
}
